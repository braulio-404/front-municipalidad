<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control y Validación de Cobranzas AMDR</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background: #f7f6f3;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      padding: 32px 40px 40px 40px;
    }
    h1 {
      color: #2d3a4a;
      margin-bottom: 16px;
    }
    .import-section {
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .import-section input[type="file"] {
      display: none;
    }
    .import-label {
      background: #2d3a4a;
      color: #fff;
      padding: 10px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.2s;
    }
    .import-label:hover {
      background: #1a2330;
    }
    .file-name {
      font-size: 1rem;
      color: #555;
    }
    .summary {
      background: #f0f4f8;
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 32px;
      font-size: 1.1rem;
    }
    .summary strong {
      color: #2d3a4a;
    }
    .actions {
      margin-bottom: 24px;
      display: flex;
      gap: 16px;
    }
    .actions button {
      background: #4caf50;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .actions button.secondary {
      background: #1976d2;
    }
    .actions button:disabled {
      background: #bdbdbd;
      cursor: not-allowed;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      background: #fff;
    }
    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.98rem;
    }
    th {
      background: #f5f7fa;
      color: #2d3a4a;
      font-weight: 700;
    }
    tr.match {
      background: #e8f5e9;
    }
    tr.mismatch {
      background: #fff3e0;
    }
    tr.missing {
      background: #ffebee;
    }
    .status {
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
    }
    .ok {
      background: #43a047;
      color: #fff;
    }
    .diff {
      background: #ffa726;
      color: #fff;
    }
    .missing-status {
      background: #e53935;
      color: #fff;
    }
    @media (max-width: 900px) {
      .container { padding: 16px; }
      .summary { flex-direction: column; gap: 12px; }
      th, td { font-size: 0.92rem; }
    }
    .side-by-side-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      margin-bottom: 16px;
    }
    .side-by-side-table th, .side-by-side-table td {
      padding: 10px 8px;
      text-align: left;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      font-size: 0.98rem;
    }
    .side-by-side-table th {
      background: #f5f7fa;
      color: #2d3a4a;
      font-weight: 700;
    }
    .side-by-side-row.match {
      background: #e8f5e9;
    }
    .side-by-side-row.mismatch {
      background: #fff3e0;
    }
    .side-by-side-row.missing {
      background: #ffebee;
    }
    .side-by-side-row.cobrada {
      background: #e3e3e3;
    }
    .side-by-side-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
    }
    .side-by-side-status .icon {
      width: 18px;
      height: 18px;
      vertical-align: middle;
    }
    .filter-bar {
      margin-bottom: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .filter-bar label {
      font-size: 1rem;
      color: #2d3a4a;
      font-weight: 500;
    }
    .filter-bar select, .filter-bar input[type="text"] {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #bdbdbd;
      font-size: 1rem;
    }
    @media (max-width: 900px) {
      .side-by-side-table th, .side-by-side-table td { font-size: 0.92rem; }
      .filter-bar { flex-direction: column; gap: 8px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Control y Validación de Cobranzas AMDR</h1>
    <div class="import-section">
      <label class="import-label" for="fileInput">Seleccionar archivo TXT</label>
      <input type="file" id="fileInput" accept=".txt">
      <span class="file-name" id="fileName">Ningún archivo seleccionado</span>
      <button id="importBtn" disabled>Importar</button>
    </div>
    <div class="summary" id="summary" style="display:none;">
      <div><strong>Periodo:</strong> <span id="periodo"></span></div>
      <div><strong>Préstamos importados:</strong> <span id="prestamos"></span></div>
      <div><strong>Cuotas importadas:</strong> <span id="cuotas"></span></div>
      <div><strong>Total importado:</strong> $<span id="total"></span></div>
    </div>
    <div class="actions">
      <button id="downloadBtn" class="secondary" disabled>Descargar reporte</button>
      <button id="reclamoBtn" disabled>Reclamar a AMDR</button>
    </div>
    <div class="filter-bar" id="filterBar" style="display:none;">
      <label for="filterEstado">Filtrar:</label>
      <select id="filterEstado">
        <option value="all">Todos</option>
        <option value="match">Coinciden</option>
        <option value="mismatch">Diferencias</option>
        <option value="missing">Faltantes</option>
        <option value="cobrada">Cobradas</option>
      </select>
      <input type="text" id="searchInput" placeholder="Buscar préstamo o cuota...">
    </div>
    <div id="sideBySideSection" style="display:none;">
      <table class="side-by-side-table">
        <thead>
          <tr>
            <th colspan="3">TXT Importado</th>
            <th colspan="3">Sistema</th>
            <th>Comparación</th>
          </tr>
          <tr>
            <th>Préstamo</th>
            <th>Cuota</th>
            <th>Monto</th>
            <th>Préstamo</th>
            <th>Cuota</th>
            <th>Monto</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="sideBySideTable">
          <!-- Filas generadas dinámicamente -->
        </tbody>
      </table>
    </div>
    <div id="alertSection"></div>
  </div>
  <script>
    // Simulación de datos del sistema (cuotas pendientes)
    const cuotasSistema = [
      { prestamo: '1001', cuota: 1, monto: 1152.40, estado: 'Pendiente' },
      { prestamo: '1001', cuota: 2, monto: 1152.40, estado: 'Pendiente' },
      { prestamo: '1001', cuota: 3, monto: 1152.40, estado: 'Pendiente' },
      { prestamo: '1002', cuota: 1, monto: 900.00, estado: 'Pendiente' },
      { prestamo: '1002', cuota: 2, monto: 900.00, estado: 'Cobrada' },
      { prestamo: '1003', cuota: 1, monto: 500.00, estado: 'Pendiente' },
    ];

    // Simulación de lectura de TXT (ahora adaptada al formato real)
    function parseTxt(content) {
      // Cada línea tiene muchos campos separados por '|'
      // Usamos: préstamo = campo 4 (índice 3), cuota = campo 11 (índice 10), monto = campo 10 (índice 9), periodo = campo 8 (índice 7)
      const lines = content.trim().split('\n');
      const cuotas = [];
      let periodo = '';
      let total = 0;
      lines.forEach(line => {
        const parts = line.split('|');
        if (parts.length >= 12) {
          const prestamo = parts[3].replace(/^0+/, ''); // quitar ceros a la izquierda
          const cuota = parseInt(parts[10]);
          const monto = parseFloat(parts[9].replace(/^0+/, ''));
          const fecPag = parts[7];
          cuotas.push({
            prestamo,
            cuota,
            monto,
            periodo: fecPag
          });
          periodo = fecPag;
          total += monto;
        }
      });
      return { cuotas, periodo, total };
    }

    // Simulación de archivo TXT de ejemplo (formato real)
    const ejemploTxt = `000|001|01|000000029827402|00000|0000025905|103953|22/04/2025|001|00000000004361571|001|3|0|000|001|
000|001|01|000000023676290|00000|0000025800|103582|22/04/2025|001|00000000030642596|001|3|0|000|001|
000|001|01|000000030787330|00000|0000025932|104031|22/04/2025|001|00000000002709338|001|3|0|000|001|`;

    // Elementos DOM
    const fileInput = document.getElementById('fileInput');
    const fileName = document.getElementById('fileName');
    const importBtn = document.getElementById('importBtn');
    const summary = document.getElementById('summary');
    const periodoSpan = document.getElementById('periodo');
    const prestamosSpan = document.getElementById('prestamos');
    const cuotasSpan = document.getElementById('cuotas');
    const totalSpan = document.getElementById('total');
    const tableSection = document.getElementById('tableSection');
    const resultTable = document.getElementById('resultTable');
    const downloadBtn = document.getElementById('downloadBtn');
    const reclamoBtn = document.getElementById('reclamoBtn');
    const alertSection = document.getElementById('alertSection');
    const filterBar = document.getElementById('filterBar');
    const filterEstado = document.getElementById('filterEstado');
    const searchInput = document.getElementById('searchInput');
    const sideBySideSection = document.getElementById('sideBySideSection');
    const sideBySideTable = document.getElementById('sideBySideTable');

    let cuotasImportadas = [];
    let periodoImportado = '';
    let totalImportado = 0;
    let sideBySideRows = [];

    // Simulación: al cargar la página, muestra el ejemplo
    window.onload = () => {
      mostrarEjemplo();
    };

    function mostrarEjemplo() {
      fileName.textContent = 'Ejemplo de archivo cargado';
      importBtn.disabled = false;
      importBtn.onclick = () => procesarImportacion(ejemploTxt);
    }

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileName.textContent = file.name;
        importBtn.disabled = false;
        importBtn.onclick = () => {
          const reader = new FileReader();
          reader.onload = function(evt) {
            procesarImportacion(evt.target.result);
          };
          reader.readAsText(file);
        };
      } else {
        fileName.textContent = 'Ningún archivo seleccionado';
        importBtn.disabled = true;
      }
    });

    function procesarImportacion(txtContent) {
      const { cuotas, periodo, total } = parseTxt(txtContent);
      cuotasImportadas = cuotas;
      periodoImportado = periodo;
      totalImportado = total;
      mostrarResumen();
      compararCuotas();
      mostrarSideBySide();
      downloadBtn.disabled = false;
      reclamoBtn.disabled = false;
      filterBar.style.display = 'flex';
      sideBySideSection.style.display = 'block';
    }

    function mostrarResumen() {
      summary.style.display = 'flex';
      periodoSpan.textContent = periodoImportado;
      prestamosSpan.textContent = [...new Set(cuotasImportadas.map(c => c.prestamo))].length;
      cuotasSpan.textContent = cuotasImportadas.length;
      totalSpan.textContent = totalImportado.toLocaleString('es-CL', { minimumFractionDigits: 2 });
    }

    function compararCuotas() {
      // Esta función solo se usaba para la tabla vieja, ahora la tabla principal es la side by side.
      // Si necesitas lógica de diferencias para alertas, puedes dejarla aquí, pero no manipula más el DOM.
      // (Dejo la función vacía para evitar errores y mantener compatibilidad si se llama en otros lados)
    }

    function mostrarSideBySide() {
      // Unir por préstamo+cuota
      const allKeys = new Set([
        ...cuotasImportadas.map(c => `${c.prestamo}|${c.cuota}`),
        ...cuotasSistema.map(c => `${c.prestamo}|${c.cuota}`)
      ]);
      sideBySideRows = [];
      allKeys.forEach(key => {
        const [prestamo, cuota] = key.split('|');
        const txt = cuotasImportadas.find(c => c.prestamo === prestamo && c.cuota == cuota);
        const sys = cuotasSistema.find(c => c.prestamo === prestamo && c.cuota == cuota);
        let rowClass = '';
        let estado = '';
        let icon = '';
        if (txt && sys) {
          if (sys.estado === 'Cobrada') {
            rowClass = 'cobrada';
            estado = 'Cobrada';
            icon = `<svg class='icon' fill='none' stroke='gray' stroke-width='2' viewBox='0 0 24 24'><path d='M9 12l2 2l4 -4'></path><circle cx='12' cy='12' r='9'></circle></svg>`;
          } else if (Math.abs(sys.monto - txt.monto) > 1) {
            rowClass = 'mismatch';
            estado = 'Diferencia';
            icon = `<svg class='icon' fill='none' stroke='#ffa726' stroke-width='2' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9'></circle><path d='M12 8v4m0 4h.01'></path></svg>`;
          } else {
            rowClass = 'match';
            estado = 'OK';
            icon = `<svg class='icon' fill='none' stroke='#43a047' stroke-width='2' viewBox='0 0 24 24'><path d='M5 13l4 4L19 7'></path></svg>`;
          }
        } else if (txt && !sys) {
          rowClass = 'missing';
          estado = 'Faltante';
          icon = `<svg class='icon' fill='none' stroke='#e53935' stroke-width='2' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9'></circle><path d='M12 8v4m0 4h.01'></path></svg>`;
        } else if (!txt && sys) {
          rowClass = 'missing';
          estado = 'Solo en sistema';
          icon = `<svg class='icon' fill='none' stroke='#1976d2' stroke-width='2' viewBox='0 0 24 24'><circle cx='12' cy='12' r='9'></circle><path d='M8 12h8'></path></svg>`;
        }
        sideBySideRows.push({
          rowClass, prestamo, cuota, txt, sys, estado, icon
        });
      });
      renderSideBySideRows();
    }

    function renderSideBySideRows() {
      const estadoFiltro = filterEstado.value;
      const search = searchInput.value.trim().toLowerCase();
      sideBySideTable.innerHTML = '';
      sideBySideRows.filter(row => {
        if (estadoFiltro !== 'all' && row.rowClass !== estadoFiltro) return false;
        if (search && !(
          (row.prestamo && row.prestamo.toLowerCase().includes(search)) ||
          (row.cuota && row.cuota.toString().includes(search))
        )) return false;
        return true;
      }).forEach(row => {
        sideBySideTable.innerHTML += `
          <tr class="side-by-side-row ${row.rowClass}">
            <td>${row.txt ? row.txt.prestamo : '-'}</td>
            <td>${row.txt ? row.txt.cuota : '-'}</td>
            <td>${row.txt ? '$' + row.txt.monto.toLocaleString('es-CL', { minimumFractionDigits: 2 }) : '-'}</td>
            <td>${row.sys ? row.sys.prestamo : '-'}</td>
            <td>${row.sys ? row.sys.cuota : '-'}</td>
            <td>${row.sys ? '$' + row.sys.monto.toLocaleString('es-CL', { minimumFractionDigits: 2 }) : '-'}</td>
            <td class="side-by-side-status">${row.icon} ${row.estado}</td>
          </tr>
        `;
      });
    }

    filterEstado.addEventListener('change', renderSideBySideRows);
    searchInput.addEventListener('input', renderSideBySideRows);

    downloadBtn.onclick = () => {
      let csv = 'Prestamo,Cuota,Monto TXT,Monto Sistema,Estado Sistema,Comparación\n';
      cuotasImportadas.forEach(cuotaTxt => {
        const match = cuotasSistema.find(c => c.prestamo === cuotaTxt.prestamo && c.cuota === cuotaTxt.cuota);
        let comparacion = '';
        if (match) {
          if (match.estado === 'Cobrada') {
            comparacion = 'Ya cobrada';
          } else if (Math.abs(match.monto - cuotaTxt.monto) > 1) {
            comparacion = 'Diferencia de monto';
          } else {
            comparacion = 'OK';
          }
        } else {
          comparacion = 'No existe en sistema';
        }
        csv += `${cuotaTxt.prestamo},${cuotaTxt.cuota},${cuotaTxt.monto},${match ? match.monto : '-'},${match ? match.estado : '-'},${comparacion}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reporte_cobranzas.csv';
      a.click();
      URL.revokeObjectURL(url);
    };

    reclamoBtn.onclick = () => {
      alert('Funcionalidad de reclamo a AMDR: aquí se podría generar un correo o archivo con las diferencias encontradas.');
    };
  </script>
</body>
</html>
